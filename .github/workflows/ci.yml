name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolabs/rust-action@1.79.0

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install Solana
        uses: metadaoproject/setup-solana@v1
        with:
          solana-cli-version: 1.18.0

      - name: Cache Solana tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: ${{ runner.os }}-solana-1.18.0
          restore-keys: |
            ${{ runner.os }}-solana-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build program
        run: |
          cd programs/attestations
          cargo build-bpf

      - name: Build IDL
        run: anchor idl build

      - name: Run tests
        run: anchor test --skip-build

      - name: Verify artifacts
        run: |
          if [ ! -f target/idl/attestations.json ]; then
            echo "IDL not generated"
            exit 1
          fi
          if [ ! -f target/deploy/attestations.so ]; then
            echo "Program binary not generated"
            exit 1
          fi
          echo "All artifacts generated successfully"

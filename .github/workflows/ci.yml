name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Anchor.toml exists
        run: |
          if [ ! -f Anchor.toml ]; then
            echo "Anchor.toml not found"
            exit 1
          fi
          echo "✓ Anchor.toml exists"

      - name: Check program source exists
        run: |
          if [ ! -f programs/attestations/src/lib.rs ]; then
            echo "Program source not found"
            exit 1
          fi
          echo "✓ Program source exists"
